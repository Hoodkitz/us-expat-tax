apiVersion: v1
kind: ConfigMap
metadata:
  name: erica-vault-agent-config
  namespace: expat-tax
data:
  # Wird sowohl vom Init-Container (einmaliger Lauf, -exit-after-auth)
  # als auch vom Sidecar (Dauerbetrieb für Token-/Zertifikats-Renewal)
  # verwendet. Die Kubernetes-Auth-Methode nutzt automatisch das
  # projizierte ServiceAccount-Token des Pods
  # (/var/run/secrets/kubernetes.io/serviceaccount/token) - kein
  # manuelles Secret-Handling für die Authentifizierung nötig.
  agent.hcl: |
    vault {
      address = "https://vault.vault-system.svc.cluster.local:8200"
      retry {
        num_retries = 8
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "erica-service-role"
        }
      }

      sink "file" {
        config = {
          path = "/vault/secrets/.vault-token"
          mode = 0400
        }
      }
    }

    template {
      source      = "/vault/config/eric-cert.tpl"
      destination = "/vault/secrets/elster.pfx"
      perms       = "0400"
      # error_on_missing_key verhindert, dass bei einem Vault-Lesefehler
      # eine LEERE Datei geschrieben wird, die vault_backoff.py fälschlich
      # als "vorhanden" durchwinken könnte (size > 0 Check würde greifen,
      # aber ein leeres/korruptes Zertifikat wäre trotzdem gefährlich).
      error_on_missing_key = true
    }

  eric-cert.tpl: |
    {{- with secret "secret/data/eric-cert" -}}
    {{ .Data.data.pfx_base64 | base64Decode }}
    {{- end -}}
