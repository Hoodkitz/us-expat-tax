apiVersion: v1
kind: Namespace
metadata:
  name: expat-tax
  labels:
    # Aktiviert Linkerd-Injection standardmäßig für ALLE Pods in diesem
    # Namespace (Namespace-Level-Annotation). Die zusätzliche Pod-Level-
    # Annotation in den Deployments unten ist bewusst redundant gesetzt,
    # damit ein versehentliches Entfernen des Namespace-Labels (z.B. bei
    # einem Namespace-Recreate durch ein anderes Team) nicht lautlos zu
    # unvermaschten, unverschlüsselten Pods führt - Fail-Closed statt
    # Fail-Open bei genau diesem sicherheitskritischen Setting.
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-backend
  namespace: expat-tax
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erica-service
  namespace: expat-tax
  annotations:
    # Vault-Kubernetes-Auth bindet die Vault-Rolle "erica-service-role"
    # exakt an diese ServiceAccount-Identität (Namespace + Name). Nur
    # Pods, die mit GENAU diesem ServiceAccount laufen, können das
    # ELSTER-Zertifikat aus Vault abrufen.
    vault.io/expected-role: "erica-service-role"
