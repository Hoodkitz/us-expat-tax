name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core deps (skip heavy system-lib deps)
        run: |
          pip install \
            "fastapi==0.115.*" \
            "uvicorn[standard]==0.32.*" \
            "sympy==1.13.*" \
            "httpx==0.27.*" \
            "pydantic==2.9.*" \
            "pydantic[email]>=2.9" \
            "pytest==8.3.*" \
            "pytest-asyncio==0.24.*" \
            "passlib[bcrypt]>=1.7.4" \
            "bcrypt>=3.2.0,<4.0.0" \
            "python-jose[cryptography]>=3.3.0" \
            "python-dotenv>=1.0.1"
      - name: Run tests (skip heavy-dep test files)
        run: |
          cd backend && python -m pytest app/tests/ -x -q \
            --ignore=app/tests/test_chat_assistant.py
      - name: Type check (optional, non-blocking)
        run: pip install pyright && pyright backend/app/ || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
